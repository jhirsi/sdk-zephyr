# Overlay for net.dns.dispatch.dual_iface (merged with prj.conf)
# Dual-homed DNS socket dispatcher pairing test (no mDNS).

CONFIG_NET_DRIVERS=y
CONFIG_NET_UDP=y
CONFIG_NET_UDP_CHECKSUM=n
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_LOOPBACK=n
CONFIG_NET_L2_ETHERNET=n

CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_IF_MAX_IPV6_COUNT=2

CONFIG_NET_INTERFACE_NAME=y
CONFIG_NET_CONTEXT_REUSEPORT=y
CONFIG_DNS_RESOLVER_AUTO_INIT=n
CONFIG_ZVFS_POLL_MAX=16
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_DNS_RESOLVER_ADDITIONAL_BUF_CTR=1
