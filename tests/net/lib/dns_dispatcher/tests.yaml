common:
  tags:
    - dns
    - net
  depends_on: netif
  min_ram: 21
  timeout: 600
tests:
  net.dns.dispatch:
    min_ram: 21
  net.dns.dispatch.ctx_cleanup:
    extra_configs:
      - CONFIG_DNS_RECONFIGURE_CLEANUP=y
  net.dns.dispatch.ctx_no_cleanup:
    extra_configs:
      - CONFIG_DNS_RECONFIGURE_CLEANUP=n
  net.dns.dispatch.dual_iface:
    min_ram: 28
    extra_conf_files:
      - prj_dual_iface.conf
